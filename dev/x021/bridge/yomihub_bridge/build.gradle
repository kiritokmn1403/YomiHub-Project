// YomiHub 0.2.1: JVM bridge for the Windows version - runs the Kotatsu
// parsers and IReader desktop extensions (.jar) behind the same loopback
// HTTP API as the Android bridges (YomiKotatsu.kt / YomiIReader.kt), on the
// JRE bundled with M-Extension-Server.
plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'application'
}

group = 'yomihub'
version = '0.2.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

dependencies {
    implementation('com.github.Kotatsu-Redo:kotatsu-parsers-redo:b3c0000245') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'io.github.ireaderorg:source-api:1.5.1'
    implementation 'org.json:json:20250517'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.3.2'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}

application {
    mainClass = 'yomihub.bridge.MainKt'
    applicationName = 'yomihub-bridge'
}
